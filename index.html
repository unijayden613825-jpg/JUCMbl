<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典賽管理中心 - 多球隊與一二軍管理</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        h1, h2 { text-align: center; color: #0f172a; }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .team-select-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }
        .btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 16px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn.active {
            background: var(--primary);
            color: white;
        }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        
        .team-manage-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .roster-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) {
            .roster-grid { grid-template-columns: 1fr; }
        }
        .tier-box {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            min-height: 150px;
        }
        .tier-box h3 { margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 6px; }
        .player-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
        }
        .player-actions {
            display: flex;
            gap: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }
        th { background: #e2e8f0; }
        input[type="text"] {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        .form-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚾ 經典賽管理中心</h1>

    <!-- 球隊切換按鈕區 -->
    <div class="team-select-container" id="team-buttons">
        <!-- 動態生成球隊按鈕 -->
    </div>

    <!-- 球隊管理列 (新增球隊 / 改名 / 刪除) -->
    <div class="team-manage-bar">
        <input type="text" id="new-team-name" placeholder="輸入新球隊名稱..." style="max-width: 200px;">
        <button class="btn btn-success" onclick="addTeam()">➕ 新增球隊</button>
        <button class="btn" onclick="renameActiveTeam()">✏️ 改名目前球隊</button>
        <button class="btn btn-danger" onclick="deleteActiveTeam()">🗑️ 刪除目前球隊</button>
    </div>

    <!-- 球員升降與名單管理區 -->
    <div class="card">
        <h2 id="current-team-title">球員升降與名單管理</h2>
        
        <div class="roster-grid">
            <!-- 一軍區 -->
            <div class="tier-box">
                <h3>🔥 一軍名單</h3>
                <div id="tier-1-list"></div>
            </div>
            <!-- 二軍區 -->
            <div class="tier-box">
                <h3>🌱 二軍名單</h3>
                <div id="tier-2-list"></div>
            </div>
        </div>

        <!-- 新增球員表單 -->
        <div class="form-row">
            <input type="text" id="new-player-name" placeholder="輸入新球員姓名...">
            <button class="btn btn-success" onclick="addPlayer()" style="white-space: nowrap;">新增球員</button>
        </div>
    </div>

    <!-- 五場經典賽程表 -->
    <div class="card">
        <h2>🏆 五場系列賽賽程與比分</h2>
        <table>
            <thead>
                <tr>
                    <th>場次</th>
                    <th>賽況紀錄</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Game 1 開幕戰</td>
                    <td><input type="text" value="球隊A vs 球隊B (比分: 0 - 0)" style="text-align:center;"></td>
                    <td>未開打</td>
                </tr>
                <tr>
                    <td>Game 2</td>
                    <td><input type="text" value="球隊A vs 球隊B (比分: 0 - 0)" style="text-align:center;"></td>
                    <td>未開打</td>
                </tr>
                <tr>
                    <td>Game 3 聽牌戰</td>
                    <td><input type="text" value="球隊B vs 球隊A (比分: 0 - 0)" style="text-align:center;"></td>
                    <td>未開打</td>
                </tr>
                <tr>
                    <td>Game 4 背水一戰</td>
                    <td><input type="text" value="球隊B vs 球隊A (比分: 0 - 0)" style="text-align:center;"></td>
                    <td>未開打</td>
                </tr>
                <tr>
                    <td>Game 5 殊死戰</td>
                    <td><input type="text" value="球隊A vs 球隊B (比分: 0 - 0)" style="text-align:center;"></td>
                    <td>未開打</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 資料初始化
    let teams = ["卡比巴拉隊", "饅頭隊"];
    let activeTeam = "卡比巴拉隊";
    let players = [
        { id: 1, name: "隊長卡比", team: "卡比巴拉隊", tier: 1 },
        { id: 2, name: "快腿卡比", team: "卡比巴拉隊", tier: 2 },
        { id: 3, name: "重炮饅頭", team: "饅頭隊", tier: 1 },
        { id: 4, name: "新秀饅頭", team: "饅頭隊", tier: 2 }
    ];

    function init() {
        renderTeams();
        renderPlayers();
    }

    function renderTeams() {
        const container = document.getElementById('team-buttons');
        container.innerHTML = '';
        
        if (teams.length > 0 && !teams.includes(activeTeam)) {
            activeTeam = teams[0];
        }

        teams.forEach(team => {
            const btn = document.createElement('button');
            btn.className = `btn ${team === activeTeam ? 'active' : ''}`;
            btn.innerText = team;
            btn.onclick = () => switchTeam(team);
            container.appendChild(btn);
        });

        document.getElementById('current-team-title').innerText = `${activeTeam} - 球員升降與名單管理`;
    }

    function switchTeam(teamName) {
        activeTeam = teamName;
        renderTeams();
        renderPlayers();
    }

    function addTeam() {
        const input = document.getElementById('new-team-name');
        const name = input.value.trim();
        if (!name) return alert("請輸入球隊名稱！");
        if (teams.includes(name)) return alert("該球隊名稱已存在！");

        teams.push(name);
        input.value = '';
        switchTeam(name);
    }

    function renameActiveTeam() {
        const newName = prompt(`請輸入「${activeTeam}」的新名稱：`, activeTeam);
        if (!newName || !newName.trim()) return;
        const trimmed = newName.trim();
        if (teams.includes(trimmed)) return alert("此名稱已存在！");

        // 更新球隊陣列
        const index = teams.indexOf(activeTeam);
        teams[index] = trimmed;

        // 更新該球隊底下所有球員的所屬球隊名稱
        players.forEach(p => {
            if (p.team === activeTeam) p.team = trimmed;
        });

        activeTeam = trimmed;
        renderTeams();
        renderPlayers();
    }

    function deleteActiveTeam() {
        if (teams.length <= 1) {
            return alert("至少需保留一個球隊，無法刪除！");
        }
        if (!confirm(`確定要刪除「${activeTeam}」以及該隊所有球員嗎？`)) return;

        // 刪除該隊球員
        players = players.filter(p => p.team !== activeTeam);
        // 刪除球隊
        teams = teams.filter(t => t !== activeTeam);
        activeTeam = teams[0];

        renderTeams();
        renderPlayers();
    }

    function renderPlayers() {
        const t1List = document.getElementById('tier-1-list');
        const t2List = document.getElementById('tier-2-list');
        t1List.innerHTML = '';
        t2List.innerHTML = '';

        const filtered = players.filter(p => p.team === activeTeam);

        if (filtered.length === 0) {
            t1List.innerHTML = '<p style="color: #64748b; font-size: 14px;">目前無一軍球員</p>';
            t2List.innerHTML = '<p style="color: #64748b; font-size: 14px;">目前無二軍球員</p>';
            return;
        }

        filtered.forEach(player => {
            const div = document.createElement('div');
            div.className = 'player-item';
            
            if (player.tier === 1) {
                div.innerHTML = `
                    <span>${player.name}</span>
                    <div class="player-actions">
                        <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="toggleTier(${player.id})">降二軍 ⬇️</button>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deletePlayer(${player.id})">X</button>
                    </div>
                `;
                t1List.appendChild(div);
            } else {
                div.innerHTML = `
                    <span>${player.name}</span>
                    <div class="player-actions">
                        <button class="btn btn-success" style="padding: 4px 8px; font-size: 12px;" onclick="toggleTier(${player.id})">升一軍 ⬆️</button>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deletePlayer(${player.id})">X</button>
                    </div>
                `;
                t2List.appendChild(div);
            }
        });
    }

    function toggleTier(id) {
        const player = players.find(p => p.id === id);
        if (player) {
            player.tier = player.tier === 1 ? 2 : 1;
            renderPlayers();
        }
    }

    function addPlayer() {
        const input = document.getElementById('new-player-name');
        const name = input.value.trim();
        if (!name) return alert("請輸入球員姓名！");

        const newPlayer = {
            id: Date.now(),
            name: name,
            team: activeTeam,
            tier: 2 // 預設新增於二軍
        };

        players.push(newPlayer);
        input.value = '';
        renderPlayers();
    }

    function deletePlayer(id) {
        if (!confirm("確定要刪除這位球員嗎？")) return;
        players = players.filter(p => p.id !== id);
        renderPlayers();
    }

    // 初始化執行
    init();
</script>

</body>
</html>
